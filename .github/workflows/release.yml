name: Build and Release Executables

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: hack-a-gent-linux
            built_name: hack-a-gent
          - os: windows-latest
            asset_name: hack-a-gent-windows.exe
            built_name: hack-a-gent.exe
          - os: macos-latest
            asset_name: hack-a-gent-macos
            built_name: hack-a-gent

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exclude build folders from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TOOL_CACHE"
          Add-MpPreference -ExclusionPath "$env:TEMP"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\pyinstaller"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY_DIR=$(dirname "$(which python)")
            export PATH="$PY_DIR:$PY_DIR/Scripts:/c/Windows/System32:/c/Windows"
          fi
          pyinstaller --onefile --name hack-a-gent \
            --collect-all gpt_researcher \
            --hidden-import tiktoken_ext.openai_public \
            --hidden-import tiktoken_ext \
            --exclude-module torch \
            --exclude-module tensorflow \
            --exclude-module scipy \
            --exclude-module matplotlib \
            --exclude-module tkinter \
            --exclude-module IPython \
            --exclude-module pytest \
            --exclude-module numba \
            --exclude-module llvmlite \
            --exclude-module spacy \
            --exclude-module thinc \
            --exclude-module fitz \
            --exclude-module pymupdf \
            --exclude-module pypdfium2 \
            --exclude-module pypdfium2_raw \
            --exclude-module onnxruntime \
            --exclude-module grpc \
            --exclude-module pyarrow \
            --exclude-module pandas \
            --exclude-module sqlalchemy \
            --exclude-module boto3 \
            --exclude-module botocore \
            --exclude-module playwright \
            --exclude-module selenium \
            main.py

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp "dist/${{ matrix.built_name }}" "release-assets/${{ matrix.asset_name }}"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/${{ matrix.asset_name }}
