  - main [ref=f3e121]:
    - generic [ref=f3e122]:
      - generic [ref=f3e123]:
        - article [ref=f3e124]:
          - heading "About the challenge" [level=4] [ref=f3e125]
          - heading "Get started" [level=4] [ref=f3e126]
          - text: About AIYES
          - paragraph [ref=f3e127]: The International AI Youth Education Society (AIYES) is a global non-profit organization dedicated to inspiring, educating, and empowering young people in the field of artificial intelligence, thereby shaping an ethical, innovative, and inclusive future.
          - paragraph [ref=f3e128]: The association brings together education experts, universities, AI technology companies, training institutions, and related professional social organizations from around the world to jointly promote AI education for young people. Based in the United States and with a global reach, the AIYES Association organizes various activities to encourage young people worldwide to learn about AI, utilize AI effectively, and use AI to drive educational change and innovation.
          - paragraph [ref=f3e129]: The association upholds the values of "democracy, diversity, connectivity and innovation", inspiring and uniting young people around the world to help every child achieve a wonderful life through AI.
          - text: About This Competition
          - paragraph [ref=f3e130]: Amid the rapid evolution of AI, the 1st International Youth AI Competition is launched to empower young creators worldwide. Open to elementary, middle, and high school students of all nationalities, races, languages, and cultural backgrounds, the competition is now accepting project submissions.
          - paragraph [ref=f3e131]: Participants can work individually or in teams. Projects should use AI to solve real-world problems through apps, proposals, creative images, or videos.
          - paragraph [ref=f3e132]: "The competition is held twice a year: a Spring session with a deadline of March 1, and a Fall session with a deadline of September 1."
        - article [ref=f3e133]:
          - heading "Requirements" [level=3] [ref=f3e135]
          - generic [ref=f3e137]:
            - heading "What to Build" [level=4] [ref=f3e138]
            - heading "What to Submit" [level=4] [ref=f3e139]
            - paragraph [ref=f3e140]
            - text: Competition Tracks Track 1 - AI Application Development
            - paragraph [ref=f3e141]: Focused on designing, building, and deploying practical applications powered by artificial intelligence. Participants progress through stages such as problem definition, data handling, model selection or integration, application development, testing, and user experience design. Emphasis is placed on transforming AI capabilities—such as machine learning, computer vision, natural language processing, or generative AI—into functional, user-centric apps, while considering performance, ethics, and real-world impact.
            - paragraph [ref=f3e142]: "Required Submissions:"
            - paragraph [ref=f3e143]: Slide Presentation
            - paragraph [ref=f3e144]: A presentation outlining the complete development journey, including problem identification, technical solution design, and evaluation of innovation, impact, and constraints.
            - paragraph [ref=f3e145]: Video Walkthrough & Live Demo (up to 5 minutes)
            - paragraph [ref=f3e146]: A video showcasing the app's development process and a live demonstration of its functionality.
            - paragraph [ref=f3e147]: Source Code or Deployment Link
            - paragraph [ref=f3e148]: A link to the project's source code repository or a deployed, accessible version of the app.
            - paragraph [ref=f3e149]
            - text: Track 2 - AI Innovation Proposal
            - paragraph [ref=f3e150]: Design and present original, forward-thinking proposals that apply artificial intelligence to solve real-world problems or create novel technological solutions. Contestants typically outline a clear problem statement, innovative AI-driven approach, technical feasibility, potential impact, and ethical considerations. Proposals are evaluated by experts based on creativity, technical soundness, practicality, and societal value, with the goal of fostering innovation and critical thinking.
            - paragraph [ref=f3e151]: "Required Submissions:"
            - paragraph [ref=f3e152]: AI Innovation Proposal Document
            - paragraph [ref=f3e153]: A written proposal clearly outlining the problem statement, the AI-driven solution, technical feasibility, potential impact, and ethical considerations.
            - paragraph [ref=f3e154]: Slide Presentation
            - paragraph [ref=f3e155]: A slide deck presenting the problem, AI solution, technical approach, and impact/ethics.
            - paragraph [ref=f3e156]: Video Presentation (up to 5 minutes)
            - paragraph [ref=f3e157]: A recorded presentation explaining the proposal and walking through the quad-square poster, covering all required points in a clear and engaging manner.
            - paragraph [ref=f3e158]
            - text: Track 3 - AI Generative Image Storytelling Track
            - paragraph [ref=f3e159]: Use AI tools to design a coherent sequence of images that visually narrate a story from beginning to end. Each submission presents a structured storyline—such as introduction, development, conflict, and resolution—expressed through multiple AI-generated frames accompanied by brief captions or explanations. Entries are evaluated on narrative clarity, originality, visual coherence, effective use of generative AI, and the overall impact of the story being told.
            - paragraph [ref=f3e160]: "Required Submissions:"
            - paragraph [ref=f3e161]: AI-Generated Image Series (up to 10 images)
            - paragraph [ref=f3e162]: A creative and coherent set of images produced using AI tools.
            - paragraph [ref=f3e163]: Slide Presentation
            - paragraph [ref=f3e164]: A slide deck showcasing the image series in sequence.
            - paragraph [ref=f3e165]: Video Walkthrough (up to 5 minutes)
            - paragraph [ref=f3e166]: A video explaining the creative concept, AI tools used, and the prompts or methods applied.
            - paragraph [ref=f3e167]
            - text: Track 4 - AI Generative Video Maker Track
            - paragraph [ref=f3e168]: Apply AI tools to produce original videos. Contestants leverage AI tools for tasks such as script generation, image-to-video or text-to-video synthesis, animation, visual effects, voice or music generation, and video editing. Submissions are evaluated based on storytelling quality, originality, technical execution, effective and responsible use of generative AI, visual and audio coherence, and the overall impact of the video.
            - paragraph [ref=f3e169]: "Required Submissions:"
            - paragraph [ref=f3e170]: Core AI-Generated Video (3-5 minutes)
            - paragraph [ref=f3e171]: An original video created using AI tools, with no restrictions on style or format.
            - paragraph [ref=f3e172]: Slide Presentation
            - paragraph [ref=f3e173]: A slide deck describing the concept, storyline, AI tools used, and how AI contributed to the creative process.
            - paragraph [ref=f3e174]: Video Walkthrough (up to 5 minutes)
            - paragraph [ref=f3e175]: A video explaining the creative concept, AI tools used, and the prompts or methods applied.
