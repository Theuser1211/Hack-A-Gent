  - main [ref=f3e121]:
    - generic [ref=f3e122]:
      - generic [ref=f3e123]:
        - article [ref=f3e124]:
          - heading "About the Challenge" [level=4] [ref=f3e125]
          - paragraph [ref=f3e126]: VoltHacks 2026 is a hackathon focused on building real world solutions using hardware, IoT, and AI. Participants are encouraged to go beyond traditional software projects and create systems that interact with the physical world through sensors, embedded systems, automation, and intelligent devices.
          - paragraph [ref=f3e127]: Whether you're interested in robotics, smart devices, sustainability, healthcare technology, or open innovation, VoltHacks is designed to push creativity and engineering skills toward solving meaningful problems.
          - paragraph [ref=f3e128]: "Tracks could include:"
          - list [ref=f3e129]:
            - listitem [ref=f3e130]: Robotics & Embedded Systems
            - listitem [ref=f3e131]: AI + Hardware Integration
            - listitem [ref=f3e132]: Smart Health Technology
            - listitem [ref=f3e133]: Sustainability & Smart Cities
            - listitem [ref=f3e134]: Open Innovation
            - listitem [ref=f3e135]: Anything Engineering based with Impact
          - paragraph [ref=f3e136]: Participants will present their projects to a panel of judges, with awards recognizing innovation, technical complexity, and real world impact.
          - heading "Get Started" [level=4] [ref=f3e137]
          - list [ref=f3e138]:
            - listitem [ref=f3e139]: Register individually or with a team
            - listitem [ref=f3e140]: Brainstorm a project idea related to the challenge themes
            - listitem [ref=f3e141]: Build your project during the hackathon period
            - listitem [ref=f3e142]: Submit your final project on Devpost before the deadline
          - paragraph [ref=f3e143]: All skill levels are welcome. Whether you're experienced with hardware or just getting started, VoltHacks is meant to be a place to learn, collaborate, and build something meaningful.
        - article [ref=f3e144]:
          - heading "Requirements" [level=3] [ref=f3e146]
          - generic [ref=f3e148]:
            - heading "What to Build" [level=4] [ref=f3e149]
            - paragraph [ref=f3e150]: "Build a project related to one or more of the VoltHacks themes, such as:"
            - list [ref=f3e151]:
              - listitem [ref=f3e152]: IoT systems
              - listitem [ref=f3e153]: Robotics and automation
              - listitem [ref=f3e154]: AI-powered tools
              - listitem [ref=f3e155]: Embedded systems
              - listitem [ref=f3e156]: Smart devices
              - listitem [ref=f3e157]: Sustainability or health technology solutions
            - paragraph [ref=f3e158]: Projects can be hardware-based, software-based, or a combination of both.
            - heading "What to Submit" [level=4] [ref=f3e159]
            - paragraph [ref=f3e160]: "Each submission should include:"
            - list [ref=f3e161]:
              - listitem [ref=f3e162]: Project name and short description
              - listitem [ref=f3e163]: Explanation of the problem your project solves
              - listitem [ref=f3e164]: Photos, screenshots, or prototype images
              - listitem [ref=f3e165]: Source code or GitHub repository (if applicable)
              - listitem [ref=f3e166]: List of technologies/components used
            - paragraph [ref=f3e167]: Teams should clearly explain how their project works and what makes it innovative.
