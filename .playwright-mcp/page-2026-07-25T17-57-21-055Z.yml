                - paragraph [ref=e471]: When content has types, fields, and references, you can build features that actually understand relationships. A recipe site where scaling servings updates every ingredient. A shopping list that combines amounts across multiple recipes. An event directory that shows "all talks by this speaker" without maintaining separate lists.
                - paragraph [ref=e472]: Flat files and markdown can't do this easily. Structured content can.
                - paragraph [ref=e473]: "The Challenge: Use an AI coding assistant (Cursor, Claude Code, v0, Lovable, or similar) with Sanity's MCP Server to build an application where structured content unlocks at least one feature users will love. The more you can get out of the content, the better."
                - paragraph [ref=e474]: "Requirements: 1.Build a site or app for a real (or realistic) use case 2. Include at least one feature that depends on queryable, structured content (not just \"displaying content,\" but using the structure to enable something) 3. Use Sanity as your content backend via the MCP Server 4. Deploy to production so we can try it out"
                - paragraph [ref=e475]: "Examples of what we mean: - A reading list app where books have authors, and you can see \"all books by authors you've read\" - A course catalog where prerequisites are references, enabling \"show me what I can take next\" - A product comparison tool that queries specs across items"
                - paragraph [ref=e476]:
