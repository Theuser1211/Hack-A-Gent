                - paragraph [ref=e415]:
                  - text: "Prizes coming Soon! Contact:"
                  - link "hasun@retool.com" [ref=e416] [cursor=pointer]:
                    - /url: mailto:hasun@retool.com
                - paragraph [ref=e417]: Challenge Overview
                - paragraph [ref=e418]: The challenge with shipping internal tools isn’t business logic - it’s setup, custom code, deployment, and iteration. For this DevWeek 2026 challenge, participants will use Retool’s AppGen solution to generate the foundation of a real internal application, then spend the rest of the hackathon evolving it into something useful, thoughtful, and production-ready.
                - paragraph [ref=e419]: You’ll create your own Retool tenant and be challenged to go from idea → working internal tool, starting with AI-powered app generation and continuing through refinement, extension, and polish over the course of the hackathon.
                - paragraph [ref=e420]: This challenge is designed to reward speed at the start, creative scope, and depth over time.
                - paragraph [ref=e421]: What You’ll Build;
                - paragraph [ref=e422]: Participants can build any internal tool they choose and are encouraged to explore your real business challenges for sources of inspiration.
                - paragraph [ref=e423]: "Requirement: Your project must use Retool Assist (AppGen) to generate an initial version of the app. From there, you can refine the application using Retool’s drag-and-drop functionality, custom code, or continue leveraging Retool Assist all the way to the finish line."
                - paragraph [ref=e424]: "How It Works:"
                - paragraph [ref=e425]:
                  - text: 1. Create a Retool tenant and share the domain with
                  - link "hasun@retool.com" [ref=e426] [cursor=pointer]:
                    - /url: mailto:hasun@retool.com
                - paragraph [ref=e427]: 2. Use Retool Assist (AppGen) to generate a starting app
                - paragraph [ref=e428]: 3. Iterate, extend, and refine your app over the hackathon period
                - paragraph [ref=e429]: "4. Submit your app along with a short 5 minute recording explaining:"
                - paragraph [ref=e430]: "--The problem you’re solving"
                - paragraph [ref=e431]: "--How Retool’s AppGen solution helped you get started"
                - paragraph [ref=e432]: "--The solution you ultimately delivered Nice To Haves:"
                - paragraph [ref=e433]: "No backend setup is required to participate - but deeper technical work is encouraged and rewarded if you do. Participants may choose to:"
                - paragraph [ref=e434]: • Design and refine complex UIs and interactions
                - paragraph [ref=e435]: • Add workflows, background jobs, or automations
                - paragraph [ref=e436]: • Connect real or mock data sources
                - paragraph [ref=e437]: • Write JavaScript or SQL queries
                - paragraph [ref=e438]: • Integrate other data sources
                - paragraph [ref=e439]: • Layer in other Retool AI actions or Agents
                - paragraph [ref=e440]: "You Can Treat AppGen As:"
                - paragraph [ref=e441]: • A jumpstart for your app development lifecycle
                - paragraph [ref=e442]: • A collaborator you iterate with throughout the build
                - paragraph [ref=e443]: Who Should Participate
                - paragraph [ref=e444]: • Front-end developers can focus on UX, interaction design, and polish
                - paragraph [ref=e445]: • Back-end and platform engineers can build workflows, integrations, and automation
                - paragraph [ref=e446]: • Product managers, designers, and operators can turn real problems into working tools
                - paragraph [ref=e447]: • AI-curious stakeholders can explore how natural language becomes functional software without any prior experience with writing code
                - paragraph [ref=e448]: This challenge is intentionally inclusive so you don't need technical coding experience. If you can describe a problem, there’s a meaningful way to participate.
                - paragraph [ref=e449]: Judging Criteria
                - paragraph [ref=e450]: "Submissions will be evaluated on:"
                - paragraph [ref=e451]: • Clarity and relevance of the problem solved
                - paragraph [ref=e452]: • Effective use of Retool Assist
                - paragraph [ref=e453]: • Depth and thoughtfulness of iteration over time
                - paragraph [ref=e454]: • Production-grade quality of the final app
                - paragraph [ref=e455]: Bonus Consideration
                - paragraph [ref=e456]: "Judges may award extra credit for:"
                - paragraph [ref=e457]: Workflow automation or background processing
                - paragraph [ref=e458]: Well-designed, intuitive UX
                - paragraph [ref=e459]: Thoughtful use of AI or agents
                - paragraph [ref=e460]: Creative executions of your initial concept
                - paragraph [ref=e461]: Happy Hacking!
