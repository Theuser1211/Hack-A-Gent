              - heading "⋆ You.com - Build Intelligent Applications with You.com APIs" [level=6] [ref=e270]:
                - generic [ref=e271]:
                  - generic [ref=e272]: ⋆
                  - generic [ref=e273]: You.com - Build Intelligent Applications with You.com APIs
              - generic [ref=e274]:
                - generic [ref=e275]: 2 winners
                - paragraph [ref=e276]:
                  - text: "1st Place: $200 Amazon gift Card + $200 API credits 2nd Place: $200 Amazon Gift Card + $100 API Credits Contact:"
                  - link "mariane.bekker@you.com" [ref=e277] [cursor=pointer]:
                    - /url: mailto:mariane.bekker@you.com
                - paragraph [ref=e278]: We’re looking for creative and impactful projects that use You.com APIs to build AI agents and applications capable of thinking, reasoning, and searching live.
                - paragraph [ref=e279]: The strongest submissions will show how real-time web data, structured research, and citation-backed results can be combined to deliver more reliable, trustworthy, and useful AI experiences. Whether you’re building an intelligent agent, research copilot, or real-time insight tool, we’re excited to see how you turn live information into meaningful action.
                - paragraph [ref=e280]: "Projects will be evaluated based on:"
                - paragraph [ref=e281]: 1. Thoughtful and effective use of You.com APIs 2. Quality, clarity, and completeness of the overall solution 3. Creativity and originality of the idea or approach 4. Product vision, usability, and real-world impact
                - paragraph [ref=e282]: All projects must integrate at least one of our public APIs.
                - paragraph [ref=e283]:
                  - link "https://you.com/resources/hackathon" [ref=e284] [cursor=pointer]:
                    - /url: https://you.com/resources/hackathon
            - generic [ref=e285]:
              - heading "⋆ Akamai Technologies - Build the Most Creative Open-Source Solution on Linode" [level=6] [ref=e286]:
                - generic [ref=e287]:
                  - generic [ref=e288]: ⋆
                  - generic [ref=e289]: Akamai Technologies - Build the Most Creative Open-Source Solution on Linode
              - generic [ref=e290]:
                - generic [ref=e291]: 1 winner
                - paragraph [ref=e292]:
                  - text: "1st Place: Nvidia Jetson Orin Nano Super Developer Kit (up to 5 based on team size) Need help setting up your Akamai Cloud Computing account? Contact Support"
                  - link "https://www.linode.com/support/" [ref=e293] [cursor=pointer]:
                    - /url: https://www.linode.com/support/
                - paragraph [ref=e294]: Create the most creative and impactful open-source solution built on Linode Kubernetes Engine (LKE) or Linode Compute, showcasing how developers can design scalable, modern applications on Akamai Cloud Computing. Bonus points will be awarded for projects that leverage GPU-accelerated workloads, especially for AI/ML, data processing, or advanced compute use cases.
                - paragraph [ref=e295]: "Why This Challenge? Modern applications demand performance, flexibility, and portability—from cloud-native microservices to AI-powered workloads at the edge. This hackathon challenges you to explore what’s possible when open source meets developer-friendly cloud infrastructure. Whether you’re experimenting with Kubernetes, WebAssembly, AI pipelines, or edge-native architectures, this challenge is about: Turning open-source innovation into real-world solutions Demonstrating modern application patterns Showing how developers can build and scale confidently on Akamai Cloud"
                - paragraph [ref=e296]: "Technical Requirements To be eligible: Your project must run on: Linode Kubernetes Engine (LKE) or Linode Compute Your solution must leverage open-source software Projects must be deployable and demonstrable"
                - paragraph [ref=e297]: Show Us Your Build Teams are required to submit a short video demo (2–5 minutes) showing their project in action. This is your chance to walk us through what you built, how it works, and why it matters. Think of it as a quick “show and tell” for the judges.
                - paragraph [ref=e298]: "Bonus scoring for: GPU usage AI/ML workloads Advanced Kubernetes or WASM implementations"
                - paragraph [ref=e299]: Judging Criteria Winners will be selected based on a balanced evaluation of creativity, technical execution, platform usage, and future potential. Submissions should demonstrate innovative thinking and thoughtful use of open-source technologies deployed on Linode Kubernetes Engine (LKE) or Linode Compute. Judges will look for projects that go beyond basic functionality and clearly show how modern cloud-native, AI/ML, WebAssembly, or edge architectures can be applied in meaningful and scalable ways. Bonus consideration will be given to solutions that effectively leverage GPU-accelerated workloads.
                - paragraph [ref=e300]: All submissions must include a publicly accessible GitHub repository containing the full source code, along with clear instructions for deployment and usage. This ensures that each project is original, functional, and can be evaluated in depth. Entries that exist only as high-level ideas, minimal proofs of concept, or rely heavily on auto-generated code without meaningful implementation will not be considered. Evaluation will focus on the completeness of the solution, quality of engineering decisions, and effective use of Linode or LKE resources.
                - paragraph [ref=e301]: Finally, judges will assess the real-world applicability and long-term potential of each submission. Strong entries will demonstrate thoughtful architecture, clear documentation, and consideration for scalability, portability, and future expansion. Projects should clearly communicate not just what was built, but why it matters and how it could evolve beyond the hackathon into a more impactful solution.
                - paragraph [ref=e302]: Account Setup Requirement To participate, all hackers must complete the setup of a new Akamai Cloud Computing (Linode) account using the $1,000 promotional credit.
                - paragraph [ref=e303]:
                  - text: "Complete Account Setup Sign up here:"
                  - link "https://login.linode.com/signup?promo=akm-eve-dev-hack-1000-12126-M866" [ref=e304] [cursor=pointer]:
                    - /url: https://login.linode.com/signup?promo=akm-eve-dev-hack-1000-12126-M866
                  - text: "Provide: -Your name -Billing address -A valid credit card -Important Billing Notes You are only charged when you deploy a paid service You may change your payment method after account activation"
                - paragraph [ref=e305]: "The $1,000 promotional credit: -Is valid for 90 days -Applies to eligible services only"
                - paragraph [ref=e306]:
                  - text: "Helpful Documentation: Understanding how billing works"
                  - link "https://techdocs.akamai.com/cloud-computing/docs/understanding-how-billing-works" [ref=e307] [cursor=pointer]:
