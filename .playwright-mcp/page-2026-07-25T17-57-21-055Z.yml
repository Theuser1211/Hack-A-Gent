              - generic [ref=e402]:
                - generic [ref=e403]: 2 winners
                - paragraph [ref=e404]:
                  - text: "1st Place: $500 Visa gift card 2nd Place: $200 Visa gift card Contact:"
                  - link "Alyssa.nicoll@progress.com" [ref=e405] [cursor=pointer]:
                    - /url: mailto:Alyssa.nicoll@progress.com
                - paragraph [ref=e406]: "Use the Progress UI Generator to design a UI for something you wish existed. It can be: • a serious productivity tool • an internal dashboard you’d actually enjoy using • a tiny app that fixes one very annoying problem • a delightfully ridiculous idea that just makes sense in UI form The goal isn’t perfection — it’s clarity, creativity, and intention. If you can explain why it exists and show the UI, you’re doing it right. ________________________________________ What to Submit To enter, submit: 1. A short description (2–5 sentences) explaining what the UI is for 2. Screenshots or a short video of the generated UI 3. (Optional) A repo or demo using the generated output That’s it. No long write-ups. No slide decks. No overthinking. ________________________________________ How We’ll Judge It We’re looking for: • Clarity — does the UI fit the problem it’s solving? • Creativity — interesting ideas, flows, or layouts • Thoughtfulness — smart component and structure choices • Fun — yes, this absolutely counts You do not need a fully built or production-ready app to win. ________________________________________ Tools & Resources You’re free to use any framework or stack, as long as your UI is generated using the Progress UI Generator. Core Tool • Progress UI Generator Generate UI layouts and scaffolding powered with Kendo UI components. UI Libraries Options The UI Generator builds with Kendo UI, which means you can extend or implement your design using: • Kendo UI for Angular • Kendo UI for React • Kendo UI for Blazor Helpful Extras (Totally Optional) • GitHub (for sharing code) • StackBlitz or CodeSandbox (for quick demos) • Short screen recordings or GIFs to show interaction • Any planning tools you like (Figma, sketches, vibes) ________________________________________ The Spirit of the Challenge This isn’t about building the “right” app. It’s about showing how you think, how you design, and what you wish tools did better. Surprise us. Make us laugh. Solve something tiny. Solve something big. We can’t wait to see what you build."
