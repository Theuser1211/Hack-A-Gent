            - list [ref=e152]:
              - listitem [ref=e153]: Registration - Must register on Devpost prior to Hackathon.
              - listitem [ref=e154]: This is an in-person & online hackathon. Teams will be formed on Devpost.com at the DeveloperWeek 2026 Hackathon. From Devpost, participants can message each other to form teams, participate in chat boards, and communicate with sponsors.
              - listitem [ref=e155]: Teams can build apps from scratch (Mobile App / Web App).
              - listitem [ref=e156]: Teams can solve no challenges (build whatever you want) or can submit to as many challenges as they want.
              - listitem [ref=e157]: There will be two rounds of judging. During Round 1, judges will review all team projects and fill out a scoring sheet on each to determine the Overall Hackathon Winner. Round 2 is the Sponsor Round of judging. Each sponsor will judge the teams working on their Challenge(s) and determine a winner(s). The sponsors choose their own prize winners.
              - listitem [ref=e158]: "Round 1 judging will be based on: 1) PROGRESS: How much progress you make on your submission; 2) CONCEPT: Does your submission solve a real problem?; and 3) FEASIBILITY: Could your submission grow/evolve to become a startup or be a profitable business."
