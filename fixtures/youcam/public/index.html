<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a12" />
    <title>FrameForge — Image Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8l3.5 3L11 6l4 5 3-2.5L21 9v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z" />
              <circle cx="8.5" cy="13.5" r="1.6" />
            </svg>
          </span>
          <span class="brand-name">FrameForge</span>
          <span class="brand-sub">Image Studio</span>
        </div>
        <div class="topbar-right">
          <span class="pill" id="mode-pill">Local processing · offline</span>
        </div>
      </header>

      <main class="grid">
        <section class="panel workspace">
          <div class="panel-head">
            <div>
              <h2>Workspace</h2>
              <p class="sub" id="image-meta">Drop an image or load the sample</p>
            </div>
            <div class="toolbar">
              <button class="btn btn--ghost" id="btn-sample" type="button">Sample image</button>
              <button class="btn btn--ghost" id="btn-upload" type="button">Upload…</button>
              <input type="file" id="file-input" accept="image/*" hidden />
            </div>
          </div>

          <div class="viewport" id="viewport">
            <div class="dropzone" id="dropzone">
              <div class="dz-icon" aria-hidden="true">&#8595;</div>
              <div>Drop an image here</div>
              <div class="dz-sub">or use the bundled sample image</div>
            </div>
            <div class="before-after" id="before-after" hidden>
              <div class="ba-image" id="ba-image"></div>
              <div class="ba-divider" id="ba-divider" aria-hidden="true"></div>
              <span class="ba-label ba-label--before">Before</span>
              <span class="ba-label ba-label--after">After</span>
              <input type="range" id="ba-range" class="ba-range" min="0" max="100" value="50" aria-label="Compare slider" />
            </div>
          </div>

          <div class="effect-bar">
            <div class="effect-chips" id="effect-chips"></div>
            <div class="intensity-row">
              <label class="intensity-label" for="intensity">Intensity</label>
              <input type="range" id="intensity" min="0" max="100" value="50" />
              <span class="intensity-value" id="intensity-value">0.50</span>
            </div>
            <div class="btn-row">
              <button class="btn btn--primary" id="btn-apply" type="button">Apply &amp; inspect</button>
            </div>
          </div>
        </section>

        <section class="panel inspector">
          <div class="panel-head">
            <h2>API Inspector</h2>
            <span class="pill pill--dark" id="boundary-pill">YouCamApiProvider</span>
          </div>

          <div class="tabs" id="tabs">
            <button class="tab is-active" data-tab="request" type="button">Request</button>
            <button class="tab" data-tab="response" type="button">Response</button>
            <button class="tab" data-tab="pipeline" type="button">Pipeline</button>
          </div>
          <div class="tab-body" id="tab-body">
            <div class="placeholder">Apply an effect to capture the API call.</div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
